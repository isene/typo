<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes press { 0%,100% { transform: translateY(0); } 8% { transform: translateY(3px); } 16% { transform: translateY(0); } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .k1 { animation: press 2.4s ease-in-out infinite; }
    .k2 { animation: press 2.4s ease-in-out 0.3s infinite; }
    .k3 { animation: press 2.4s ease-in-out 0.6s infinite; }
    .k4 { animation: press 2.4s ease-in-out 0.9s infinite; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>
  <!-- Keycaps: t y p o -->
  <g font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <g class="k1">
      <rect x="32" y="74" width="42" height="42" rx="7" fill="#141422" stroke="#f74c00" stroke-width="2"/>
      <text x="53" y="102" fill="#ddd">t</text>
    </g>
    <g class="k2">
      <rect x="82" y="74" width="42" height="42" rx="7" fill="#141422" stroke="#f74c00" stroke-width="2"/>
      <text x="103" y="102" fill="#ddd">y</text>
    </g>
    <g class="k3">
      <rect x="132" y="74" width="42" height="42" rx="7" fill="#141422" stroke="#f74c00" stroke-width="2"/>
      <text x="153" y="102" fill="#ddd">p</text>
    </g>
    <g class="k4">
      <rect x="182" y="74" width="42" height="42" rx="7" fill="#141422" stroke="#f74c00" stroke-width="2"/>
      <text x="203" y="102" fill="#ddd">o</text>
    </g>
  </g>
  <!-- Drill line: typed (green), untyped (gray), cursor -->
  <g font-family="monospace" font-size="16" letter-spacing="2">
    <text x="52" y="148" fill="#5faf5f">asdf</text>
    <text x="106" y="148" fill="#f74c00" class="cursor">▌</text>
    <text x="118" y="148" fill="#555">jkl</text>
  </g>
  <!-- Home row bumps -->
  <g opacity="0.5">
    <rect x="88" y="158" width="14" height="3" rx="1.5" fill="#f74c00"/>
    <rect x="154" y="158" width="14" height="3" rx="1.5" fill="#f74c00"/>
  </g>
  <text x="128" y="205" font-family="monospace" font-size="24" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="3">typo</text>
  <text x="128" y="223" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">touch typing tutor</text>
</svg>
