[package]
name = "typo"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Terminal touch-typing tutor. Part of the Fe2O3 suite, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/typo"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }

[profile.release]
opt-level = 3
lto = true
